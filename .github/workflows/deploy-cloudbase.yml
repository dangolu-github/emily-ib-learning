name: Deploy Emily learner mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emily-cloudbase-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build learner-only mirror
        run: npm run build:cloudbase

      - name: Reject forbidden learner routes
        run: |
          test ! -e cloudbase-dist/teacher
          test ! -e cloudbase-dist/edge-functions
          test ! -e cloudbase-dist/.git
          test ! -e cloudbase-dist/.planning
          test ! -e cloudbase-dist/private
          test ! -e cloudbase-dist/scripts

      - name: Install CloudBase CLI
        run: npm install --global @cloudbase/cli@3.6.4

      - name: Authenticate to the CloudBase environment
        run: >-
          tcb login
          --cloudbase-api-key "${{ secrets.TCB_API_KEY }}"
          --env-id "${{ secrets.TCB_ENV_ID }}"
          --json

      - name: Deploy a new learner-only application version
        run: >-
          tcb app deploy emily-ib-learning-git
          --env-id "${{ secrets.TCB_ENV_ID }}"
          --framework static
          --install-command "npm install"
          --build-command "npm run build:cloudbase"
          --output-dir "./cloudbase-dist"
          --deploy-path "/emily-ib-learning"
          --force
          --json

      - name: Verify served commit
        run: |
          test -n "$TCB_PUBLIC_URL"
          served_commit="$(curl --fail --silent --show-error "${TCB_PUBLIC_URL%/}/deployment-meta.json" | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).sourceCommit')"
          test "$served_commit" = "$GITHUB_SHA"
        env:
          TCB_PUBLIC_URL: ${{ vars.TCB_PUBLIC_URL }}
